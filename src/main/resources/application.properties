# Overpass API Configuration
overpass.api.url=https://overpass-api.de/api/interpreter
overpass.map.query.radius=150
overpass.road.query.radius=50

# Rendering settings
render.road.width=6
staticmap.scale=2
staticmap.zoom=18
staticmap.size=500

# Image processing settings
image.skip.pixels=50
image.step.size=1.0
# Scale: meters per pixel (265 meters across 1000 pixels)
image.scale=0.265

# Cross-street detection angle offset from bearing (degrees)
detection.angle.offset=25

# HTTP client settings
http.connect.timeout.seconds=10
http.read.timeout.seconds=30
