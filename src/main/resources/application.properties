# Google Maps API Configuration
google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# Static Map settings
staticmap.scale=2
staticmap.zoom=18
staticmap.size=500
staticmap.road.color=0x00ff00

# Image processing settings
image.skip.pixels=50
image.step.size=1.0
# Scale: meters per pixel (265 meters across 1000 pixels)
image.scale=0.265

# Cross-street detection angle offset from bearing (degrees)
detection.angle.offset=25

# HTTP client settings
http.connect.timeout.seconds=5
http.read.timeout.seconds=5