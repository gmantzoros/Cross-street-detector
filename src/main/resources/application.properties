# Overpass API Configuration
# Comma-separated endpoints, tried in order. The client fails over to the next one
# on timeout / rate-limit and then sticks with whichever endpoint last worked.
#
# IMPORTANT: every endpoint here must serve the *whole planet*. Regional instances
# (overpass.osm.ch = Switzerland only, overpass.osm.jp = Japan only) answer HTTP 200
# with an empty element list for Greek coordinates, which failover cannot distinguish
# from a genuine "no roads nearby" result and would silently corrupt evaluation runs.
#
# Verified against Thessaloniki (40.642851, 22.931444) on 2026-08-21 — all three
# returned an identical 70 ways:
#   openstreetmap.fr  ~1.0s   planet, no aggressive per-IP throttle
#   overpass-api.de   ~0.5s   planet, but ~2 slots/IP — the source of your timeouts
#   maps.mail.ru      ~6.1s   planet, slow but works as a last resort
#
# overpass.private.coffee (Kumi Systems) advertises "no rate limits" and is worth
# promoting to the front if it recovers, but on 2026-08-21 it returned 502/500 and
# hung for 85s per request, so it is deliberately left out of the rotation.
overpass.api.urls=https://overpass.openstreetmap.fr/api/interpreter,\
  https://overpass-api.de/api/interpreter,\
  https://maps.mail.ru/osm/tools/overpass/api/interpreter
overpass.map.query.radius=200

# Sent on every Overpass request. private.coffee requires a meaningful User-Agent
# that identifies the project and gives operators a way to contact you.
overpass.user.agent=CrossStreetDetector/1.0 (https://github.com/mantzorosg/Cross-street-detector)

# On-disk cache of raw Overpass responses, keyed by a hash of the query string.
# A batch run over the full test set issues ~450 requests; with the cache warm it
# issues none, which makes parameter sweeps fast and keeps the road data fixed
# across runs. Entries never expire — delete the directory to refetch.
overpass.cache.enabled=true
overpass.cache.dir=cache

# Pause before each outgoing Overpass request. Enforced by OverpassClient rather
# than by the batch loop, so cache hits are never delayed.
overpass.rate.limit.delay.ms=3000

# HTTP client settings
# Connect timeout is deliberately short: the public mirrors are dual-stack, so a
# dead endpoint burns this budget once per address family before we fail over.
http.connect.timeout.seconds=5
http.read.timeout.seconds=60
